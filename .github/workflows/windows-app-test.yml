name: windows-app-test
on: workflow_dispatch
jobs:
  app:
    runs-on: windows-latest
    steps:
      - name: Install the Persian font
        shell: powershell
        run: irm https://raw.githubusercontent.com/MoAliTheGoat/claude-persian-font/main/windows/install.ps1 | iex
      - name: Install Claude desktop
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # The release list names the current full package; unpack it and run claude.exe from there.
          $line = (Invoke-WebRequest https://downloads.claude.ai/releases/win32/x64/RELEASES -UseBasicParsing).Content.Trim().Split("`n")[-1]
          $nupkg = ($line -split '\s+')[1]
          "package: $nupkg"
          Invoke-WebRequest "https://downloads.claude.ai/releases/win32/x64/$nupkg" -OutFile claude.zip -UseBasicParsing
          Expand-Archive claude.zip -DestinationPath claude-app -Force
          Get-ChildItem claude-app -Recurse -Filter claude.exe | Select-Object FullName
      - name: Run Claude for 60 seconds and screenshot it
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $exe = Get-ChildItem claude-app -Recurse -Filter claude.exe | Select-Object -First 1
          Start-Process $exe.FullName
          Start-Sleep 25; Shot 'app-25s'
          Start-Sleep 35; Shot 'app-60s'
          $p = Get-Process claude -ErrorAction SilentlyContinue
          "claude processes alive after 60s: $(@($p).Count)"
          if (-not $p) { throw 'Claude is not running after 60 seconds' }
          Get-ChildItem "$env:APPDATA\Claude\logs" -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 15 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: app-screens, path: '*.png' }
